        window.handleFileUpload = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            state.showUploadModal = false;
            window.showToast(`Uploading ${file.name}...`);
            try {
                const res = await fetch("/api/upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/octet-stream", "X-Filename": file.name },
                    body: file
                });
                const d = await res.json();
                if (d.status === "success") {
                    window.showToast("Upload complete! Simulation running.");
                    window.runLiveSimulation();
                }
            } catch (err) {
                window.showToast(`Saved to videos/${file.name}. Run in terminal: python main.py`);
            }

        // Initialize immediately
        renderAll();
        fetchLiveVideos();
    })();
